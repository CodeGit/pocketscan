name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
      
      - name: Check formatting
        working-directory: infra
        run: tofu fmt -check -recursive
      
      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: | 
          tofu init -backend=false
          tofu validate
  
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pocketscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/pocketscan_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest -v

  open-pr:
    needs: [infra, api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open Pull Request from dev to main if one does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/main...dev" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then
            echo "dev has nothing new for main"; exit 0
          fi
          open=$(gh pr list --head dev --base main --state open --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "A PR is already open"; exit 0
          fi
          gh pr create --head dev --base main \
            --title "Promote dev to main" \
            --body "Opened automatically after CI passed on ${GITHUB_SHA::7}. Needs human approval."
