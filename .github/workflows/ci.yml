name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
      
      - name: Check formatting
        working-directory: infra
        run: tofu fmt -check -recursive
      
      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: | 
          tofu init -backend=false
          tofu validate
  
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pocketscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/pocketscan_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest -v

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest -v

  # Builds both images from the repo root (pipeline/ depends on ../api by path) and
  # checks each starts. Nothing is pushed. Layers are cached in the GitHub Actions
  # cache; a cold pipeline build compiles fpocket, so it is the slowest job. It is not
  # (yet) a required check or a dependency of open-pr.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
            smoke: python -c "import pocketscan_api.main" && alembic -c /app/alembic.ini heads
          - name: pipeline
            dockerfile: pipeline/Dockerfile
            smoke: fpocket -h && python -c "import Bio, pocketscan_api" && analyse.py --help
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # mode=max also caches the intermediate stages, which is what saves the fpocket
      # compile. Each image has its own cache scope so they do not evict each other.
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: pocketscan-${{ matrix.name }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke test ${{ matrix.name }} image
        run: docker run --rm pocketscan-${{ matrix.name }}:ci sh -c '${{ matrix.smoke }}'

  open-pr:
    needs: [infra, api, pipeline]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open Pull Request from dev to main if one does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/main...dev" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then
            echo "dev has nothing new for main"; exit 0
          fi
          open=$(gh pr list --head dev --base main --state open --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "A PR is already open"; exit 0
          fi
          gh pr create --head dev --base main \
            --title "Promote dev to main" \
            --body "Opened automatically after CI passed on ${GITHUB_SHA::7}. Needs human approval."
