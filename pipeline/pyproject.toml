[project]
name = "pocketscan-pipeline"
version = "0.1.0"
description = "Nextflow pipeline helpers: fetch an AlphaFold model, analyse fpocket output"
requires-python = ">=3.14"
dependencies = [
    "biopython>=1.86",
    # The last pipeline step writes to PostgreSQL through the API package's ingest module.
    "pocketscan-api",
]

[tool.uv.sources]
pocketscan-api = { path = "../api" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py314"
line-length = 100
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# bin/ holds the scripts Nextflow runs; tests import them as modules.
pythonpath = ["bin"]
